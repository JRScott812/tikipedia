<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- Build-time base only (never from location.pathname — avoids reflected XSS). -->
		<base href="%BASE_URL%" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>

		<title>Tikipedia — Wikipedia Shorts</title>
		<meta
			name="description"
			content="Swipe through Wikipedia as narrated short-form videos with captions — live from Wikimedia, in multiple languages."
		/>
		<meta name="application-name" content="Tikipedia" />
		<meta name="author" content="Tikipedia" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Tikipedia" />
		<link rel="canonical" href="https://jrscott812.github.io/xikipedia/" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="Tikipedia" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://jrscott812.github.io/xikipedia/" />
		<meta property="og:title" content="Tikipedia — Wikipedia Shorts" />
		<meta
			property="og:description"
			content="Swipe through Wikipedia as narrated short-form videos with captions — live from Wikimedia, in multiple languages."
		/>
		<meta
			property="og:image"
			content="https://jrscott812.github.io/xikipedia/og-image.png"
		/>
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1536" />
		<meta property="og:image:height" content="1024" />
		<meta
			property="og:image:alt"
			content="Tikipedia — Wikipedia Shorts: TikTok-style W logo on black"
		/>

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tikipedia — Wikipedia Shorts" />
		<meta
			name="twitter:description"
			content="Swipe through Wikipedia as narrated short-form videos with captions — live from Wikimedia, in multiple languages."
		/>
		<meta
			name="twitter:image"
			content="https://jrscott812.github.io/xikipedia/og-image.png"
		/>
		<meta
			name="twitter:image:alt"
			content="Tikipedia — Wikipedia Shorts: TikTok-style W logo on black"
		/>

		<link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
		<link rel="mask-icon" href="%BASE_URL%favicon.svg" color="#000000" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
